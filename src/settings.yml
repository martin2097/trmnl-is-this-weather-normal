---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: 3.1.1
serverless_language: python
polling_url: "{% assign climate_last_year = \"now\" | date: \"%Y\" | minus: 1 %}\r\nhttps://api.open-meteo.com/v1/forecast?latitude={{ lat_lon | default: latitude | split: ',' | first }}&longitude={{ lat_lon | default: longitude | split: ',' | last }}&daily=temperature_2m_max,temperature_2m_min,precipitation_sum&hourly=temperature_2m&past_hours=24&forecast_hours=1&current=temperature_2m&forecast_days=1&timezone=auto\r\nhttps://is-this-weather-normal-api.slowtech.workers.dev/v1/recent?latitude={{ lat_lon | default: latitude | split: ',' | first }}&longitude={{ lat_lon | default: longitude | split: ',' | last }}\r\n{% for climate_year in (1940..climate_last_year) %}\r\n{% assign climate_offset = climate_year | minus: 1940 %}\r\n{% assign climate_remainder = climate_offset | modulo: 30 %}\r\n{% if climate_remainder == 0 %}\r\n{% assign climate_part = climate_offset | divided_by: 30 %}\r\nhttps://is-this-weather-normal-api.slowtech.workers.dev/v1/climate/{{ climate_part }}?latitude={{ lat_lon | default: latitude | split: ',' | first }}&longitude={{ lat_lon | default: longitude | split: ',' | last }}\r\n{% endif %}\r\n{% endfor %}"
polling_headers: ''
polling_body: ''
id: 377387
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
oauth_authorize_url: ''
oauth_token_url: ''
oauth_scopes: ''
oauth_scope_separator: ''
oauth_refresh_url: ''
oauth_auth_params: ''
oauth_token_headers: ''
oauth_token_site: ''
oauth_token_params: ''
oauth_token_request_auth_method: ''
oauth_body_format: ''
oauth_token_response_metadata: ''
oauth_authorization_method: ''
oauth_refresh_params: ''
oauth_token_field_name: ''
oauth_expiry_field_name: ''
oauth_expiry_strategy: ''
oauth_fixed_expiry_ms: ''
custom_fields:
- keyname: doesnt_matter
  name: About This Plugin
  category: environment,nature
  field_type: author_bio
  description: |
    Today feels off - too cold for July, or it just won't stop raining. But is it actually unusual, or just a perfectly normal bad week? Stop guessing: this plugin gives you a straight answer on both - is today normal, near a record, or somewhere in between?
    <br/><br/>

    Compares today against this same date across 85+ years of history for your exact location, using Open-Meteo's weather archive.
    <br/><br/>

    Search for a city, address, or postal code, pick your units and it does the rest.
  github_url: https://github.com/martin2097
  learn_more_url: https://www.rapavy.cz/
  email_address: rapavy.mato@gmail.com
- keyname: lat_lon
  field_type: lat_lon
  name: Location
  description: Search for a city, address, or postal code, or enter comma-separated latitude and longitude.
- keyname: units
  field_type: select
  name: Units
  options:
  - Celsius (mm): celsius
  - Fahrenheit (inches): fahrenheit
  default: celsius
- keyname: location_label
  field_type: string
  name: Display name
  description: Optional location name shown on the screen, e.g. your town
  placeholder: Prague
  optional: true
name: Is this weather normal?
description: See current weather in context
refresh_interval: 120

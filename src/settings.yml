---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: 3.1.1
serverless_language: python
polling_url:
polling_headers:
polling_body:
id: 377387
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
oauth_authorize_url: ''
oauth_token_url: ''
oauth_scopes: ''
oauth_scope_separator: ''
oauth_refresh_url: ''
oauth_auth_params:
oauth_token_headers:
oauth_token_site: ''
oauth_token_params:
oauth_token_request_auth_method: ''
oauth_body_format: ''
oauth_token_response_metadata: ''
oauth_authorization_method: ''
oauth_refresh_params: ''
oauth_token_field_name: ''
oauth_expiry_field_name: ''
oauth_expiry_strategy: ''
oauth_fixed_expiry_ms: ''
custom_fields:
- keyname: latitude
  field_type: string
  name: Latitude
  description: GPS latitude in decimal degrees
  help_text: Right-click your location in <a href="https://maps.google.com" target="_blank">Google Maps</a> and copy the first number.
  placeholder: '50.0867'
- keyname: longitude
  field_type: string
  name: Longitude
  description: GPS longitude in decimal degrees
  help_text: The second number from Google Maps.
  placeholder: '14.4153'
- keyname: location_label
  field_type: string
  name: Location name
  description: Optional label shown on the screen, e.g. your town
  placeholder: Prague
  optional: true
- keyname: units
  field_type: select
  name: Units
  options:
  - 'Celsius (mm): celsius'
  - 'Fahrenheit (inches): fahrenheit'
  default: celsius
- keyname: doesnt_matter
  name: About This Plugin
  category: environment,nature
  field_type: author_bio
  description: "Today feels off - too cold for July, or it just won't stop raining. But is it actually unusual, or just a perfectly normal bad week? Stop guessing: this plugin gives you a straight answer on both - is today normal, near a record, or somewhere in between? \n<br/><br/>\n\nCompares today against this same date across 85+ years of history for your exact location, using Open-Meteo's weather archive.\n<br/><br/>\n\nJust drop in your coordinates - right-click your location on Google Maps and copy the two numbers - and it does the rest.\n"
  github_url: https://github.com/martin2097
  learn_more_url: https://www.rapavy.cz/
  email_address: rapavy.mato@gmail.com
name: Is this weather normal?
refresh_interval: 120
oauth_connection_config:
